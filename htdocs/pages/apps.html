<!-- Path: htdocs/pages/apps.html -->
<h1 style="border-bottom: 2px solid var(--neon-purple); display: inline-block; padding-bottom: 5px;">
    // APP LAUNCHER
</h1>

<div class="dashboard-grid">
    <div class="card">
        <h3><i class="fas fa-tools"></i> UTILITIES</h3>
        <button class="btn-glitch" onclick="launchApp('notepad')">
            <i class="fas fa-sticky-note"></i> NOTEPAD
        </button>
        <button class="btn-glitch" onclick="launchApp('calc')">
            <i class="fas fa-calculator"></i> CALC
        </button>
        <button class="btn-glitch" onclick="launchApp('cmd')">
            <i class="fas fa-terminal"></i> TERMINAL
        </button>
    </div>

    <div class="card">
        <h3><i class="fas fa-gamepad"></i> OTHERS</h3>
        <button class="btn-glitch" onclick="launchApp('explorer')">
            <i class="fas fa-folder"></i> EXPLORER
        </button>
        <button class="btn-glitch" style="border-color: gold; color: gold;" onclick="launchApp('chrome')">
             <i class="fab fa-chrome"></i> BROWSER
        </button>
    </div>
</div>
