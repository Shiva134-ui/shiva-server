<div class="toolbar"><h2>App Launcher</h2></div>
<div class="dashboard-grid">
    <div class="card">
        <h3><i class="fas fa-code"></i> Dev</h3>
        <button class="btn-glitch" onclick="App.Terminal.exec('code')"><i class="fas fa-file-code"></i> VS Code</button>
        <button class="btn-glitch" onclick="App.Terminal.exec('start cmd')"><i class="fas fa-terminal"></i> CMD</button>
    </div>
    <div class="card">
        <h3><i class="fas fa-server"></i> Server</h3>
        <button class="btn-glitch" onclick="App.Terminal.exec('c:\\xampp\\xampp-control.exe')">XAMPP Control</button>
        <button class="btn-glitch" style="border-color: gold; color: gold" onclick="App.Terminal.exec('explorer')">Explorer</button>
    </div>
</div>
