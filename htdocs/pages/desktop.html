<div class="toolbar">
    <h2>Remote View</h2>
    <button class="btn-primary" onclick="App.Desktop.refresh()"><i class="fas fa-sync"></i> Refresh</button>
</div>
<div class="dashboard-grid">
    <div class="card" style="grid-column: span 2;">
        <h3>Live View</h3>
        <div style="background: #000; min-height: 300px; display: flex; align-items: center; justify-content: center;">
            <img id="desktop-view" src="" style="max-width: 100%; max-height: 500px; display: none;">
            <p id="desktop-msg" style="color: #666;">Waiting for snapshot...</p>
        </div>
    </div>
    <div class="card">
        <h3>Controls</h3>
        <button class="btn-glitch" onclick="App.Desktop.vol('up')">Vol +</button>
        <button class="btn-glitch" onclick="App.Desktop.vol('down')">Vol -</button>
        <button class="btn-glitch" onclick="App.Desktop.vol('mute')">Mute</button>
        <hr style="border-color: #333;">
        <button class="btn-glitch danger" onclick="App.Desktop.power('lock')">Lock PC</button>
    </div>
</div>
