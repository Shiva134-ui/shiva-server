<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHIVA CLOUD CONSOLE</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.24.1/ace.js"></script>
</head>
<body>

    <div class="cloud-sidebar">
        <div class="cloud-brand">
            <i class="fas fa-cloud"></i> SHIVA PLATFORM
        </div>
        <div class="cloud-nav">
            <div class="nav-item active" data-target="dashboard">
                <i class="fas fa-tachometer-alt"></i> Dashboard
            </div>
            <div class="nav-item" data-target="storage" data-file="pages/storage.html">
                <i class="fas fa-database"></i> Storage
            </div>
            <div class="nav-item" data-target="console" data-file="pages/console.html">
                <i class="fas fa-terminal"></i> Bot Engine
            </div>
            <div class="nav-item" data-target="launcher" data-file="pages/launcher.html">
                <i class="fas fa-rocket"></i> Launcher
            </div>
            <div class="nav-item" data-target="terminal" data-file="pages/terminal.html">
                <i class="fas fa-code"></i> Terminal
            </div>
            <div class="nav-item" data-target="desktop" data-file="pages/desktop.html">
                <i class="fas fa-desktop"></i> Remote View
            </div>
            <div class="nav-item" data-target="hosting" data-file="pages/hosting.html">
                <i class="fas fa-globe"></i> App Hosting
            </div>
            <div class="nav-item" data-target="network" data-file="pages/network.html">
                <i class="fas fa-network-wired"></i> Network Ops
            </div>
        </div>
        <div style="padding: 20px;">
            <small style="color: #666">v2.0.0 (BETA)</small>
        </div>
    </div>

    <div class="cloud-main">
        <header class="cloud-header">
            <h3>Project: Home Server</h3>
            <div style="display: flex; gap: 15px; align-items: center;">
                <button class="btn-icon" id="theme-toggle" title="Toggle Theme">
                    <i class="fas fa-moon"></i>
                </button>
                <div class="user-profile">
                    <i class="fas fa-user-circle"></i> Admin
                </div>
            </div>
        </header>

        <div class="page-content">
            <div id="dashboard" class="page active">
                <div class="toolbar">
                    <h1>Central Command</h1>
                    <small>Real-time Monitoring</small>
                </div>
                
                <div class="dashboard-grid">
                    <div class="card">
                        <div style="display:flex; justify-content:space-between;">
                            <h3><i class="fas fa-microchip"></i> CPU Load</h3>
                            <span id="cpu-text" style="font-size: 1.5em; font-weight:bold;">0%</span>
                        </div>
                        <div class="progress-bar" style="height: 8px; background: rgba(128,128,128,0.2); border-radius: 4px; margin-top: 10px;">
                            <div id="cpu-bar" style="width: 0%; height: 100%; background: var(--primary); border-radius: 4px; transition: width 0.5s;"></div>
                        </div>
                    </div>

                    <div class="card">
                        <div style="display:flex; justify-content:space-between;">
                            <h3><i class="fas fa-memory"></i> RAM Usage</h3>
                            <span id="ram-text" style="font-size: 1.5em; font-weight:bold;">0%</span>
                        </div>
                        <div class="progress-bar" style="height: 8px; background: rgba(128,128,128,0.2); border-radius: 4px; margin-top: 10px;">
                            <div id="ram-bar" style="width: 0%; height: 100%; background: var(--primary); border-radius: 4px; transition: width 0.5s;"></div>
                        </div>
                    </div>

                    <div class="card">
                        <div style="display:flex; justify-content:space-between;">
                            <h3><i class="fas fa-hdd"></i> Storage (C:)</h3>
                            <span id="disk-text" style="font-size: 1.5em; font-weight:bold;">0%</span>
                        </div>
                        <div class="progress-bar" style="height: 8px; background: rgba(128,128,128,0.2); border-radius: 4px; margin-top: 10px;">
                            <div id="disk-bar" style="width: 0%; height: 100%; background: var(--primary); border-radius: 4px; transition: width 0.5s;"></div>
                        </div>
                        <small id="disk-details" style="display:block; margin-top:5px; color: var(--text-muted); text-align:right;">Computing...</small>
                    </div>
                </div>
            </div>
            
            <div id="storage" class="page"></div>
            <div id="console" class="page"></div>
            <div id="launcher" class="page"></div>
            <div id="terminal" class="page"></div>
            <div id="desktop" class="page"></div>
            <div id="hosting" class="page"></div>
            <div id="network" class="page"></div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
